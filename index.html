<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor P2P Binance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="flex justify-between items-center bg-gray-800 p-4 rounded-xl border border-gray-700">
            <h1 class="text-xl font-bold text-yellow-400">⚡ COMERCIANTE P2P PRO</h1>
            <span id="status" class="bg-green-900 text-green-300 text-xs px-3 py-1 rounded-full border border-green-500">EN VIVO</span>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                <p class="text-gray-400 text-xs">COMPRA</p>
                <p id="buy-price" class="text-2xl font-bold text-green-400">Cargando...</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                <p class="text-gray-400 text-xs">VENTA</p>
                <p id="sell-price" class="text-2xl font-bold text-red-400">Cargando...</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                <p class="text-gray-400 text-xs">SPREAD</p>
                <p id="spread" class="text-2xl font-bold text-yellow-400">Cargando...</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                <p class="text-gray-400 text-xs">GANANCIA</p>
                <p id="margin" class="text-2xl font-bold text-blue-400">Cargando...</p>
            </div>
        </div>

        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
            <canvas id="priceChart" height="150"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('priceChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Precio USDT/VES',
                    data: [],
                    borderColor: '#f59e0b',
                    tension: 0.1,
                    fill: false
                }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: false } } }
        });

        async function fetchPrice(tradeType) {
            const url = "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://p2p.binance.com/bapi/c2c/v2/friendly/c2c/adv/search");
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    asset: "USDT",
                    fiat: "VES",
                    merchantCheck: false,
                    page: 1,
                    rows: 1,
                    tradeType: tradeType
                })
            });
            const data = await res.json();
            return parseFloat(data.data[0].adv.price);
        }

        async function updateData() {
            try {
                const buy = await fetchPrice("BUY");
                const sell = await fetchPrice("SELL");
                const spread = sell - buy;
                const margin = ((spread / buy) * 100).toFixed(2);

                document.getElementById('buy-price').innerText = buy.toFixed(2) + ' Bs';
                document.getElementById('sell-price').innerText = sell.toFixed(2) + ' Bs';
                document.getElementById('spread').innerText = spread.toFixed(2) + ' Bs';
                document.getElementById('margin').innerText = margin + '%';

                const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                if (chart.data.labels.length > 10) {
                    chart.data.labels.shift();
                    chart.data.datasets[0].data.shift();
                }
                chart.data.labels.push(time);
                chart.data.datasets[0].data.push(buy);
                chart.update();
            } catch (e) {
                console.error(e);
            }
        }

        updateData();
        setInterval(updateData, 15000);
    </script>
</body>
</html>
