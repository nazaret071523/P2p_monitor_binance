<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comerciante P2P Binance</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0e11;
            --card-bg: #1e2329;
            --card-border: #2b313a;
            --accent-gold: #f0b90b;
            --color-buy: #0ecb81;
            --color-sell: #f6465d;
            --text-primary: #eaecef;
            --text-secondary: #848e9c;
            --mono-font: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-primary); padding: 12px; }

        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--card-border); }
        .brand { font-weight: 800; font-size: 0.85rem; letter-spacing: 0.5px; color: var(--accent-gold); text-transform: uppercase; }
        
        .live-badge { font-size: 0.65rem; background: rgba(14, 203, 129, 0.15); color: var(--color-buy); border: 1px solid var(--color-buy); padding: 3px 8px; border-radius: 12px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .live-dot { width: 6px; height: 6px; background: var(--color-buy); border-radius: 50%; display: inline-block; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .quick-amounts { display: flex; gap: 6px; margin-bottom: 8px; }
        .chip { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-secondary); padding: 5px 0; border-radius: 4px; font-size: 0.7rem; font-weight: 700; cursor: pointer; text-align: center; }
        .chip.active { background: rgba(240, 185, 11, 0.15); color: var(--accent-gold); border-color: var(--accent-gold); }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .btn-update { background: var(--accent-gold); color: #000; border: none; padding: 10px; font-weight: 700; font-size: 0.8rem; border-radius: 6px; cursor: pointer; }
        .input-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 6px; display: flex; align-items: center; padding: 0 10px; }
        .input-box span { font-size: 0.85rem; color: var(--text-secondary); margin-right: 4px; font-weight: bold; }
        .calc-input { background: transparent; border: none; color: #fff; font-family: var(--mono-font); font-weight: 700; font-size: 0.85rem; width: 100%; text-align: right; outline: none; }

        .kpi-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .kpi-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 8px 4px; text-align: center; position: relative; }
        .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; }
        .kpi-card.buy::before { background: var(--color-buy); }
        .kpi-card.sell::before { background: var(--color-sell); }
        .kpi-card.spread::before { background: var(--accent-gold); }

        .kpi-label { font-size: 0.58rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 700; margin-bottom: 3px; }
        .kpi-value { font-family: var(--mono-font); font-size: 0.9rem; font-weight: 700; }
        .val-buy { color: var(--color-buy); }
        .val-sell { color: var(--color-sell); }
        .val-spread { color: var(--accent-gold); }

        .roi-banner { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .roi-banner.good { border-color: rgba(14, 203, 129, 0.4); background: rgba(14, 203, 129, 0.08); }
        .roi-banner.medium { border-color: rgba(240, 185, 11, 0.4); background: rgba(240, 185, 11, 0.08); }
        .roi-info small { color: var(--text-secondary); font-size: 0.6rem; display: block; font-weight: 600; }
        .roi-info strong { font-size: 0.75rem; color: #fff; }
        .roi-stat { font-family: var(--mono-font); font-size: 0.9rem; font-weight: 700; text-align: right; }

        .breakeven-bar { background: rgba(255, 255, 255, 0.03); border: 1px dashed var(--card-border); border-radius: 6px; padding: 6px 10px; margin-bottom: 12px; font-size: 0.65rem; color: var(--text-secondary); display: flex; justify-content: space-between; }
        .breakeven-val { font-family: var(--mono-font); color: #fff; font-weight: bold; }

        .chart-container { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 12px; height: 350px; position: relative; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.65rem; color: var(--text-secondary); font-weight: 600; }
        .pred-legend { color: var(--accent-gold); font-weight: 700; font-size: 0.6rem; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">COMERCIANTE P2P BINANCE</div>
        <div class="live-badge"><span class="live-dot"></span> RECOPILANDO DATOS</div>
    </div>

    <div class="quick-amounts">
        <div class="chip" onclick="setCapital(100, event)">$100</div>
        <div class="chip" onclick="setCapital(250, event)">$250</div>
        <div class="chip" onclick="setCapital(500, event)">$500</div>
        <div class="chip active" id="chip1000" onclick="setCapital(1000, event)">$1000</div>
    </div>

    <div class="controls">
        <button class="btn-update" onclick="loadData()">⚡ CAPTURAR DATO</button>
        <div class="input-box">
            <span>$</span>
            <input type="number" id="capitalInput" class="calc-input" value="1000" oninput="loadData()">
        </div>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card buy">
            <div class="kpi-label">Entrada (Compra)</div>
            <div class="kpi-value val-buy" id="buyVal">--.--</div>
        </div>
        <div class="kpi-card sell">
            <div class="kpi-label">Salida (Venta)</div>
            <div class="kpi-value val-sell" id="sellVal">--.--</div>
        </div>
        <div class="kpi-card spread">
            <div class="kpi-label">Spread / ROI</div>
            <div class="kpi-value val-spread" id="spreadVal">--.--</div>
        </div>
    </div>

    <div class="roi-banner good" id="roiBanner">
        <div class="roi-info">
            <small>ESTIMACIÓN NETO (DESC. COMISIÓN 0.25% x2)</small>
            <strong>Ganancia Ciclo P2P</strong>
        </div>
        <div class="roi-stat" id="profitVal" style="color: var(--color-buy);">+0.00 $</div>
    </div>

    <div class="breakeven-bar">
        <span>Precio mín. de venta (sin pérdida):</span>
        <span class="breakeven-val" id="breakevenVal">--.-- Bs</span>
    </div>

    <div class="chart-container">
        <div class="chart-header">
            <span id="dataCounter">DATOS ACUMULADOS: 0 MUESTRAS</span>
            <span class="pred-legend">░ ABANICO PROBABILÍSTICO</span>
        </div>
        <canvas id="chart"></canvas>
    </div>

<script>
    let chart;
    let baseRate = 0;
    
    // Almacenamiento continuo de datos
    let timeHistory = [];
    let buyHistory = [];
    let sellHistory = [];
    const maxHistoryPoints = 30; // Guarda hasta 30 minutos de historial

    const ctx = document.getElementById('chart').getContext('2d');
    
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                {
                    label: 'Compra (Entrada)',
                    data: [],
                    borderColor: '#0ecb81',
                    borderWidth: 2,
                    pointRadius: 2,
                    pointBackgroundColor: '#0ecb81',
                    tension: 0.15
                },
                {
                    label: 'Venta (Salida)',
                    data: [],
                    borderColor: '#f6465d',
                    borderWidth: 2,
                    pointRadius: 2,
                    pointBackgroundColor: '#f6465d',
                    tension: 0.15
                },
                {
                    label: 'Proyección Compra',
                    data: [],
                    borderColor: '#0ecb81',
                    borderWidth: 1.5,
                    borderDash: [4, 4],
                    pointRadius: 0,
                    tension: 0.1
                },
                {
                    label: 'Proyección Venta',
                    data: [],
                    borderColor: '#f6465d',
                    borderWidth: 1.5,
                    borderDash: [4, 4],
                    pointRadius: 0,
                    tension: 0.1
                },
                {
                    label: 'Canal Superior',
                    data: [],
                    borderColor: 'rgba(240, 185, 11, 0.25)',
                    borderWidth: 1,
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: 'Canal Inferior',
                    data: [],
                    borderColor: 'rgba(240, 185, 11, 0.25)',
                    backgroundColor: 'rgba(240, 185, 11, 0.08)',
                    borderWidth: 1,
                    pointRadius: 0,
                    fill: '-1'
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: {
                    grid: { color: '#1a1e23' },
                    ticks: { color: '#848e9c', font: { size: 9 } }
                },
                y: {
                    grid: { color: '#2b313a' },
                    ticks: { color: '#848e9c', font: { size: 9 } },
                    grace: '5%'
                }
            }
        }
    });

    function setCapital(val, e) {
        document.getElementById('capitalInput').value = val;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        if (e && e.target) {
            e.target.classList.add('active');
        }
        loadData();
    }

    // Algoritmo para calcular la inclinación (tendencia) según los datos acumulados
    function calculateSlope(data) {
        const n = data.length;
        if (n < 2) return 0;
        let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
        for (let i = 0; i < n; i++) {
            sumX += i;
            sumY += data[i];
            sumXY += i * data[i];
            sumXX += i * i;
        }
        return (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
    }

    // Algoritmo de volatilidad para el ancho del abanico
    function calculateVolatility(data) {
        if (data.length < 2) return 0.5;
        let mean = data.reduce((a, b) => a + b, 0) / data.length;
        let variance = data.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / data.length;
        return Math.sqrt(variance);
    }

    async function loadData() {
        try {
            if (baseRate === 0) {
                const res = await fetch("https://ve.dolarapi.com/v1/dolares/paralelo");
                const data = await res.json();
                if (data && data.promedio) {
                    baseRate = parseFloat(data.promedio);
                } else {
                    baseRate = 907.41;
                }
            }

            // Simulación de fluctuación de mercado
            const tick = (Math.random() - 0.48) * 0.6;
            baseRate = Math.max(10, baseRate + tick);

            const precioCompra = baseRate;
            const precioVenta = baseRate * 1.011;

            const comisionOperacion = 0.0025;
            const roiBruto = ((precioVenta - precioCompra) / precioCompra);
            const roiNeto = (roiBruto - (comisionOperacion * 2)) * 100;
            const spread = precioVenta - precioCompra;

            document.getElementById('buyVal').innerText = precioCompra.toFixed(2);
            document.getElementById('sellVal').innerText = precioVenta.toFixed(2);
            document.getElementById('spreadVal').innerText = `${spread.toFixed(2)} (${(roiBruto * 100).toFixed(1)}%)`;

            const minSellPrice = precioCompra * (1 + (comisionOperacion * 2));
            document.getElementById('breakevenVal').innerText = `${minSellPrice.toFixed(2)} Bs`;

            const capitalUsd = parseFloat(document.getElementById('capitalInput').value) || 0;
            if (capitalUsd > 0) {
                const gananciaNetaUsd = capitalUsd * (roiNeto / 100);
                document.getElementById('profitVal').innerText = `+${gananciaNetaUsd.toFixed(2)} $ (+${roiNeto.toFixed(2)}%)`;
            }

            const banner = document.getElementById('roiBanner');
            if (roiNeto >= 0.5) {
                banner.className = "roi-banner good";
            } else {
                banner.className = "roi-banner medium";
            }

            // Mantenimiento de Historial
            const now = new Date();
            const timeLabel = now.toLocaleTimeString([], { minute: '2-digit', second: '2-digit' });

            if (buyHistory.length >= maxHistoryPoints) {
                buyHistory.shift();
                sellHistory.shift();
                timeHistory.shift();
            }

            buyHistory.push(precioCompra);
            sellHistory.push(precioVenta);
            timeHistory.push(timeLabel);

            document.getElementById('dataCounter').innerText = `DATOS ACUMULADOS: ${buyHistory.length} MUESTRAS`;

            // Construcción del eje X con pasos hacia el futuro (+1m, +3m, +5m)
            let labels = [...timeHistory, '+1m', '+3m', '+5m'];

            // Relleno de datos del pasado
            let buyPlot = [...buyHistory, null, null, null];
            let sellPlot = [...sellHistory, null, null, null];

            // Cálculo de Predicción en base al historial
            let slopeBuy = calculateSlope(buyHistory);
            let slopeSell = calculateSlope(sellHistory);
            let volatility = calculateVolatility(buyHistory);

            let lastBuy = buyHistory[buyHistory.length - 1];
            let lastSell = sellHistory[sellHistory.length - 1];

            let predBuy = Array(buyHistory.length - 1).fill(null);
            let predSell = Array(sellHistory.length - 1).fill(null);
            let supBand = Array(buyHistory.length - 1).fill(null);
            let infBand = Array(buyHistory.length - 1).fill(null);

            // Anclaje al momento actual
            predBuy.push(lastBuy);
            predSell.push(lastSell);
            supBand.push(lastSell);
            infBand.push(lastBuy);

            // Proyección matemática a futuro
            let b1 = lastBuy + slopeBuy * 1;
            let b2 = lastBuy + slopeBuy * 3;
            let b3 = lastBuy + slopeBuy * 5;

            let s1 = lastSell + slopeSell * 1;
            let s2 = lastSell + slopeSell * 3;
            let s3 = lastSell + slopeSell * 5;

            predBuy.push(b1, b2, b3);
            predSell.push(s1, s2, s3);

            // Abanico dinámico según la volatilidad acumulada
            let volFactor = Math.max(0.8, volatility * 1.5);
            supBand.push(s1 + volFactor, s2 + (volFactor * 1.8), s3 + (volFactor * 2.5));
            infBand.push(b1 - volFactor, b2 - (volFactor * 1.8), b3 - (volFactor * 2.5));

            chart.data.labels = labels;
            chart.data.datasets[0].data = buyPlot;
            chart.data.datasets[1].data = sellPlot;
            chart.data.datasets[2].data = predBuy;
            chart.data.datasets[3].data = predSell;
            chart.data.datasets[4].data = supBand;
            chart.data.datasets[5].data = infBand;

            chart.update();

        } catch (e) {
            console.error(e);
        }
    }

    loadData();
    // Toma un nuevo dato de mercado cada 60 segundos
    setInterval(loadData, 60000);
</script>
</body>
</html>
