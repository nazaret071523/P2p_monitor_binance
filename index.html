<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Terminal Pro - Binance</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #080a0c;
            --panel-bg: #12161c;
            --panel-border: #1e242d;
            --accent-yellow: #f0b90b;
            --color-up: #0ecb81;
            --color-down: #f6465d;
            --text-main: #f0f3f8;
            --text-muted: #6c788a;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); padding: 14px; max-width: 500px; margin: 0 auto; }

        /* Encabezado Principal */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--panel-border); }
        .app-title { font-size: 0.85rem; font-weight: 800; color: #fff; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
        .app-title span { color: var(--accent-yellow); }
        
        /* Indicador En Línea */
        .live-status { display: flex; align-items: center; gap: 6px; font-size: 0.65rem; font-weight: 700; color: var(--color-up); background: rgba(14, 203, 129, 0.1); padding: 4px 8px; border-radius: 20px; border: 1px solid rgba(14, 203, 129, 0.3); }
        .pulse-dot { width: 6px; height: 6px; background-color: var(--color-up); border-radius: 50%; box-shadow: 0 0 8px var(--color-up); animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(14, 203, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(14, 203, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(14, 203, 129, 0); }
        }

        /* Bot Inteligente Estilo Ticker */
        .ai-news-card { background: linear-gradient(135deg, rgba(240, 185, 11, 0.08) 0%, rgba(18, 22, 28, 0.95) 100%); border: 1px solid rgba(240, 185, 11, 0.3); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
        .ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .ai-tag { font-size: 0.62rem; font-weight: 800; color: var(--accent-yellow); text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 5px; }
        .ai-badge { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 800; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
        .badge-buy { background: rgba(14, 203, 129, 0.2); color: var(--color-up); border: 1px solid var(--color-up); }
        .badge-sell { background: rgba(246, 70, 93, 0.2); color: var(--color-down); border: 1px solid var(--color-down); }
        .badge-wait { background: rgba(108, 120, 138, 0.2); color: var(--text-muted); border: 1px solid var(--text-muted); }
        .ai-text { font-size: 0.75rem; color: #d0d7e2; font-weight: 600; line-height: 1.35; }

        /* Selector de Banco */
        .select-box { margin-bottom: 12px; }
        .custom-select { width: 100%; background: var(--panel-bg); border: 1px solid var(--panel-border); color: #fff; padding: 10px 12px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; outline: none; transition: all 0.2s; }
        .custom-select:focus { border-color: var(--accent-yellow); }

        /* Botones Temporalidad */
        .time-selector { display: flex; gap: 8px; margin-bottom: 14px; }
        .tf-button { flex: 1; background: var(--panel-bg); border: 1px solid var(--panel-border); color: var(--text-muted); padding: 8px 0; border-radius: 6px; font-size: 0.72rem; font-weight: 700; cursor: pointer; text-align: center; }
        .tf-button.active { background: var(--accent-yellow); color: #000; border-color: var(--accent-yellow); font-weight: 800; }

        /* Panel KPI */
        .kpi-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
        .kpi-item { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px 6px; text-align: center; }
        .kpi-lbl { font-size: 0.58rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
        .kpi-num { font-family: var(--font-mono); font-size: 0.82rem; font-weight: 800; }

        /* Gráfica Pro */
        .chart-box { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; padding: 14px; height: 350px; position: relative; }
        .chart-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.65rem; color: var(--text-muted); font-weight: 700; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="app-title">
            <span>⚡</span> TERMINAL P2P BINANCE
        </div>
        <div class="live-status">
            <div class="pulse-dot"></div> EN LÍNEA
        </div>
    </div>

    <!-- Bot Noticiero Asesor Inteligente -->
    <div class="ai-news-card">
        <div class="ai-header">
            <span class="ai-tag">📢 MERCADO & ALERTAS EN VIVO (1H)</span>
            <span class="ai-badge badge-wait" id="botBadge">ESPERAR</span>
        </div>
        <div class="ai-text" id="botNews">Analizando flujos de órdenes de mercado P2P...</div>
    </div>

    <div class="select-box">
        <select id="bankSelect" class="custom-select" onchange="onBankChange()">
            <option value="banesco">Banesco (Spread ~1.2%)</option>
            <option value="mercantil">Mercantil (Spread ~1.5%)</option>
            <option value="bdv">Banco de Venezuela (BDV) (Spread ~0.9%)</option>
            <option value="bnc">Banco Nacional de Crédito (BNC) (Spread ~1.3%)</option>
            <option value="tesoro">Banco del Tesoro (Spread ~1.6%)</option>
            <option value="provincial">BBVA Provincial (Spread ~1.1%)</option>
        </select>
    </div>

    <div class="time-selector">
        <button class="tf-button" id="tf-1h" onclick="changeTimeframe('1h')">1 Hora</button>
        <button class="tf-button active" id="tf-24h" onclick="changeTimeframe('24h')">24 Horas</button>
        <button class="tf-button" id="tf-7d" onclick="changeTimeframe('7d')">7 Días</button>
    </div>

    <div class="kpi-container">
        <div class="kpi-item">
            <div class="kpi-lbl">Precio Compra</div>
            <div class="kpi-num" id="kpiBuy" style="color: var(--color-up);">--.--</div>
        </div>
        <div class="kpi-item">
            <div class="kpi-lbl">Precio Venta</div>
            <div class="kpi-num" id="kpiSell" style="color: var(--color-down);">--.--</div>
        </div>
        <div class="kpi-item">
            <div class="kpi-lbl">Margen / Spread</div>
            <div class="kpi-num" id="kpiSpread" style="color: var(--accent-yellow);">--.--</div>
        </div>
    </div>

    <div class="chart-box">
        <div class="chart-header">
            <span>TENDENCIA Y NIVELES EN TIEMPO REAL</span>
        </div>
        <canvas id="p2pChart"></canvas>
    </div>

<script>
    let chartInstance;
    let selectedTF = '24h';
    const bankSpreads = { banesco: 0.012, mercantil: 0.015, bdv: 0.009, bnc: 0.013, tesoro: 0.016, provincial: 0.011 };

    function generateMockData(tf) {
        let count = tf === '1h' ? 12 : (tf === '24h' ? 24 : 14);
        let basePrice = 908.00;
        let labels = [];
        let prices = [];
        let now = new Date();

        for (let i = count; i >= 0; i--) {
            let label = "";
            let change = (Math.random() - 0.48) * (tf === '1h' ? 0.7 : 1.9);
            basePrice += change;

            if (tf === '1h') {
                let d = new Date(now.getTime() - i * 5 * 60000);
                label = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (tf === '24h') {
                let d = new Date(now.getTime() - i * 3600000);
                label = `${d.getHours()}:00`;
            } else {
                let d = new Date(now.getTime() - i * 86400000);
                label = `${d.getDate()}/${d.getMonth()+1}`;
            }

            labels.push(label);
            prices.push(parseFloat(basePrice.toFixed(2)));
        }
        return { labels, prices };
    }

    const ctx = document.getElementById('p2pChart').getContext('2d');

    chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                {
                    label: 'Precio',
                    data: [],
                    borderColor: '#f0b90b',
                    borderWidth: 2,
                    pointRadius: 2,
                    pointBackgroundColor: '#f0b90b',
                    tension: 0.25,
                    fill: false
                },
                {
                    label: 'Piso',
                    data: [],
                    borderColor: '#0ecb81',
                    borderWidth: 1.5,
                    borderDash: [4, 4],
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: 'Techo',
                    data: [],
                    borderColor: '#f6465d',
                    borderWidth: 1.5,
                    borderDash: [4, 4],
                    pointRadius: 0,
                    fill: false
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#12161c',
                    titleColor: '#848e9c',
                    bodyFont: { family: 'JetBrains Mono' }
                }
            },
            scales: {
                x: { grid: { color: '#1a1e24' }, ticks: { color: '#6c788a', font: { size: 9 } } },
                y: { grid: { color: '#1a1e24' }, ticks: { color: '#6c788a', font: { size: 9 } }, grace: '4%' }
            }
        }
    });

    function initBankPreference() {
        const storedBank = localStorage.getItem('p2p_selected_bank');
        if (storedBank) {
            const selectEl = document.getElementById('bankSelect');
            if (selectEl.querySelector(`option[value="${storedBank}"]`)) {
                selectEl.value = storedBank;
            }
        }
    }

    function onBankChange() {
        const val = document.getElementById('bankSelect').value;
        localStorage.setItem('p2p_selected_bank', val);
        refreshMarket();
    }

    function changeTimeframe(tf) {
        selectedTF = tf;
        document.querySelectorAll('.tf-button').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tf-${tf}`).classList.add('active');
        refreshMarket();
    }

    function runMarketBotAnalysis(prices1h) {
        const first = prices1h[0];
        const last = prices1h[prices1h.length - 1];
        const min = Math.min(...prices1h);
        const max = Math.max(...prices1h);
        const diff = (last - first).toFixed(2);

        const badge = document.getElementById('botBadge');
        const news = document.getElementById('botNews');

        if (last <= min + 0.3) {
            badge.className = "ai-badge badge-buy";
            badge.innerText = "COMPRAR";
            news.innerText = `🚨 ALERTA: El precio tocó el piso mínimo de ${min.toFixed(2)} Bs en la última hora. Excelente oportunidad de entrada por sobreventa.`;
        } else if (last >= max - 0.3) {
            badge.className = "ai-badge badge-sell";
            badge.innerText = "VENDER";
            news.innerText = `📢 AVISO: El precio alcanzó el techo de ${max.toFixed(2)} Bs (+${diff} Bs en 1h). Se recomienda toma de ganancias ante posible corrección.`;
        } else if (diff > 0.5) {
            badge.className = "ai-badge badge-buy";
            badge.innerText = "TENDENCIA ⬆";
            news.innerText = `📈 MERCADO EN ALZA: Fuerte impulso comprador (+${diff} Bs en 1h). La demanda en P2P está incrementando la cotización.`;
        } else if (diff < -0.5) {
            badge.className = "ai-badge badge-sell";
            badge.innerText = "TENDENCIA ⬇";
            news.innerText = `📉 PRESIÓN BAJISTA: El mercado cayó ${diff} Bs en los últimos 60 minutos. Precaución al acumular inventario.`;
        } else {
            badge.className = "ai-badge badge-wait";
            badge.innerText = "LATERAL";
            news.innerText = `💬 MERCADO ESTABLE: Variación mínima (${diff} Bs) en la última hora. Piso en ${min.toFixed(2)} Bs / Techo en ${max.toFixed(2)} Bs. Sin riesgos altos.`;
        }
    }

    function refreshMarket() {
        const dataset = generateMockData(selectedTF);
        const prices = dataset.prices;

        const minPrice = Math.min(...prices);
        const maxPrice = Math.max(...prices);

        const lastPrice = prices[prices.length - 1];
        const bank = document.getElementById('bankSelect').value;
        const spreadRatio = bankSpreads[bank] || 0.012;

        const buyPrice = lastPrice;
        const sellPrice = lastPrice * (1 + spreadRatio);
        const spread = sellPrice - buyPrice;

        document.getElementById('kpiBuy').innerText = buyPrice.toFixed(2);
        document.getElementById('kpiSell').innerText = sellPrice.toFixed(2);
        document.getElementById('kpiSpread').innerText = `${spread.toFixed(2)} Bs`;

        // Generar análisis dinámico de 1 hora para el Bot
        const hourlyDataset = generateMockData('1h');
        runMarketBotAnalysis(hourlyDataset.prices);

        // Actualizar gráfica con líneas integradas de Piso y Techo
        chartInstance.data.labels = dataset.labels;
        chartInstance.data.datasets[0].data = prices;
        chartInstance.data.datasets[1].data = Array(prices.length).fill(minPrice);
        chartInstance.data.datasets[2].data = Array(prices.length).fill(maxPrice);
        
        chartInstance.data.datasets[1].label = `Piso (${minPrice.toFixed(2)})`;
        chartInstance.data.datasets[2].label = `Techo (${maxPrice.toFixed(2)})`;

        chartInstance.update();
    }

    initBankPreference();
    refreshMarket();
</script>
</body>
</html>
