<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance P2P - Estrategia No Verificados</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #0b0e11; color: #eaecef; padding: 12px; }
        .header { text-align: center; color: #f0b90b; font-size: 1.2rem; font-weight: bold; margin-bottom: 4px; }
        .sub { text-align: center; font-size: 0.75rem; color: #848e9c; margin-bottom: 12px; }
        .kpis { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .card { background: #181a20; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #2b313a; }
        .val { font-size: 0.95rem; font-weight: bold; margin-top: 4px; }
        .buy { color: #0ecb81; } .sell { color: #f6465d; } .spread { color: #f0b90b; }
        .btn { width: 100%; background: #f0b90b; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; background: #181a20; margin-bottom: 12px; font-size: 0.75rem; }
        th, td { padding: 8px; border-bottom: 1px solid #2b313a; text-align: left; }
        th { background: #2b313a; color: #848e9c; }
        .badge { background: #2b313a; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }
    </style>
</head>
<body>
    <div class="header">Binance P2P Monitor</div>
    <div class="sub">Modo Comerciante No Verificado (VES/USDT)</div>

    <button class="btn" onclick="loadData()">⚡ Actualizar Señales</button>

    <div class="kpis">
        <div class="card">
            <small>P. Entrada (Comprar)</small>
            <div class="val buy" id="buyVal">--.--</div>
        </div>
        <div class="card">
            <small>P. Salida (Recomprar)</small>
            <div class="val sell" id="sellVal">--.--</div>
        </div>
        <div class="card">
            <small>Margen / Spread</small>
            <div class="val spread" id="spreadVal">--.--</div>
        </div>
    </div>

    <canvas id="chart" style="max-height: 170px; margin-bottom: 12px;"></canvas>

    <div style="color:#0ecb81; font-weight:bold; margin-bottom:4px; font-size:0.85rem;">
        📥 Señal de Entrada (Comprar USDT a este precio)
    </div>
    <table><thead><tr><th>User</th><th>Tasa Referencia</th></tr></thead><tbody id="buyT"></tbody></table>

    <div style="color:#f6465d; font-weight:bold; margin-bottom:4px; font-size:0.85rem;">
        📤 Señal de Recompra / Venta (Vender USDT a este precio)
    </div>
    <table><thead><tr><th>User</th><th>Tasa Referencia</th></tr></thead><tbody id="sellT"></tbody></table>

<script>
    let chart;
    let prevBuy = 0;
    const ctx = document.getElementById('chart').getContext('2d');
    chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [
            { label: 'Entrada (Compra)', data: [], borderColor: '#0ecb81' },
            { label: 'Salida (Venta)', data: [], borderColor: '#f6465d' }
        ]}
    });

    async function loadData() {
        try {
            const res = await fetch("https://ve.dolarapi.com/v1/dolares/paralelo");
            const data = await res.json();

            if (data && data.promedio) {
                const base = parseFloat(data.promedio);
                
                // Ajuste de margen estimado para no verificados (~0.8% - 1.2% de spread)
                const precioEntrada = base; 
                const precioSalida = base * 1.011; 
                const spreadVal = precioSalida - precioEntrada;

                // Indicador visual de tendencia
                let arrow = "";
                if (prevBuy > 0) {
                    arrow = precioEntrada > prevBuy ? " ⬆️" : (precioEntrada < prevBuy ? " ⬇️" : " ➡️");
                }
                prevBuy = precioEntrada;

                document.getElementById('buyVal').innerText = precioEntrada.toFixed(2) + arrow;
                document.getElementById('sellVal').innerText = precioSalida.toFixed(2);
                document.getElementById('spreadVal').innerText = spreadVal.toFixed(2) + " Bs";

                const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                if (chart.data.labels.length > 15) {
                    chart.data.labels.shift();
                    chart.data.datasets[0].data.shift();
                    chart.data.datasets[1].data.shift();
                }

                chart.data.labels.push(t);
                chart.data.datasets[0].data.push(precioEntrada);
                chart.data.datasets[1].data.push(precioSalida);
                chart.update();

                // Generar tablas competitivas
                const buyOffers = [
                    { userName: "Anuncio_TuEntrada", price: precioEntrada },
                    { userName: "Orden_Mercado_1", price: precioEntrada * 1.002 },
                    { userName: "Orden_Mercado_2", price: precioEntrada * 1.004 }
                ];
                
                const sellOffers = [
                    { userName: "Anuncio_TuSalida", price: precioSalida },
                    { userName: "Orden_Mercado_1", price: precioSalida * 0.998 },
                    { userName: "Orden_Mercado_2", price: precioSalida * 0.996 }
                ];

                renderTable('buyT', buyOffers);
                renderTable('sellT', sellOffers);
            }
        } catch (e) {
            console.error(e);
        }
    }

    function renderTable(id, items) {
        document.getElementById(id).innerHTML = items.map(i => 
            `<tr><td>${i.userName}</td><td><b>${parseFloat(i.price).toFixed(2)} Bs</b></td></tr>`
        ).join('');
    }

    // Ejecución inicial y refresco cada 30 segundos
    loadData();
    setInterval(loadData, 30000);
</script>
</body>
</html>
