<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venbot Predicciones | P2P Monitor</title>
  <!-- Chart.js para la gráfica interactiva -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0e14; color: #ffffff; padding: 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
    
    /* Tarjetas principales */
    .card { background: #131822; border: 1px solid #1f293d; border-radius: 14px; padding: 14px; }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; }
    .title { color: #f5b041; font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    .badge-live { background: #00e67622; color: #00e676; padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; border: 1px solid #00e676; }
    
    .time-bar { background: #1a2232; text-align: center; padding: 6px; border-radius: 8px; font-size: 12px; color: #8b9bb4; margin-top: 8px; }
    .filter-bar { background: #0288d122; color: #29b6f6; border: 1px solid #0288d1; text-align: center; padding: 6px; border-radius: 8px; font-size: 11px; margin-top: 6px; font-weight: 500; }
    
    /* Grilla de Métricas */
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
    .metric-box { background: #1a2232; padding: 10px; border-radius: 10px; text-align: center; }
    .metric-label { font-size: 10px; color: #8b9bb4; text-transform: uppercase; font-weight: bold; }
    .metric-value { font-size: 15px; font-weight: bold; margin-top: 4px; }
    .val-compra { color: #00e676; }
    .val-venta { color: #ff5252; }
    .val-spread { color: #f5b041; }
    
    /* Sección Predicción */
    .pred-card { border: 1px solid #7c4dff44; background: linear-gradient(180deg, #18132a 0%, #131822 100%); }
    .pred-header { display: flex; justify-content: space-between; font-size: 12px; color: #b388ff; font-weight: bold; }
    .pred-price { font-size: 32px; font-weight: 800; text-align: center; margin: 12px 0; color: #ffffff; }
    .pred-range { display: flex; justify-content: space-between; font-size: 12px; color: #8b9bb4; }
    
    /* Botones de Temporalidad */
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn-group { display: flex; gap: 4px; }
    .btn-time { background: #1a2232; color: #8b9bb4; border: 1px solid #2a364f; padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .btn-time.active { background: #00e676; color: #000000; border-color: #00e676; }
    
    .chart-container { position: relative; height: 200px; width: 100%; }
  </style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="card">
    <div class="header">
      <div class="title">⚡ COMERCIANTE P2P PRO</div>
      <span class="badge-live">EN VIVO</span>
    </div>
    <div class="time-bar">🇻🇪 Hora Oficial VE: <span id="hora-ve">12:14:30 p. m.</span></div>
    <div class="filter-bar">🎯 Filtro: No Verificado (10,000 Bs - 300,000 Bs)</div>
    
    <div class="grid-3">
      <div class="metric-box">
        <div class="metric-label">COMPRA</div>
        <div class="metric-value val-compra" id="val-compra">913.60 Bs</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">VENTA</div>
        <div class="metric-value val-venta" id="val-venta">921.00 Bs</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">SPREAD BRUTO</div>
        <div class="metric-value val-spread" id="val-spread">7.40 Bs</div>
      </div>
    </div>
  </div>

  <!-- Predicción ML -->
  <div class="card pred-card">
    <div class="pred-header">
      <span>PREDICCIÓN ML (+7h)</span>
      <span id="pred-tendencia" style="color: #b388ff;">ALCISTA</span>
    </div>
    <div class="pred-price" id="pred-precio">914.05 Bs</div>
    <div class="pred-range">
      <span>🟢 Piso: <b id="pred-piso" style="color:#fff;">909.00 Bs</b></span>
      <span>🔴 Techo: <b id="pred-techo" style="color:#fff;">929.00 Bs</b></span>
    </div>
  </div>

  <!-- Gráfica Interactiva -->
  <div class="card">
    <div class="chart-header">
      <span style="color:#8b9bb4; font-weight:bold; font-size:12px;">📊 TENDENCIA DE MERCADO</span>
      <div class="btn-group">
        <button id="btn-1d" onclick="cargarGrafico('1d')" class="btn-time active">1D</button>
        <button id="btn-7d" onclick="cargarGrafico('7d')" class="btn-time">7D</button>
        <button id="btn-1m" onclick="cargarGrafico('1m')" class="btn-time">1M</button>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="p2pChart"></canvas>
    </div>
  </div>

</div>

<script>
let chartInstance = null;

async function cargarGrafico(rango) {
  // Cambiar botón activo
  document.querySelectorAll('.btn-time').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-${rango}`).classList.add('active');

  try {
    const res = await fetch(`/api/historial?rango=${rango}`);
    const data = await res.json();

    const ctx = document.getElementById('p2pChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: data.labels,
        datasets: [
          {
            label: 'Venta',
            data: data.ventas,
            borderColor: '#ff5252',
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.3
          },
          {
            label: 'Compra',
            data: data.compras,
            borderColor: '#00e676',
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.3
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#8b9bb4', font: { size: 10 } } } },
        scales: {
          x: { ticks: { color: '#8b9bb4', maxTicksLimit: 5, font: { size: 10 } }, grid: { color: '#1f293d' } },
          y: { ticks: { color: '#8b9bb4', font: { size: 10 } }, grid: { color: '#1f293d' } }
        }
      }
    });
  } catch (error) {
    console.error("Error cargando datos de la gráfica:", error);
  }
}

// Carga inicial
document.addEventListener("DOMContentLoaded", () => {
  cargarGrafico('1d');
});
</script>

</body>
</html>
