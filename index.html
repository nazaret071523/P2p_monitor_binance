<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comerciante P2P Pro - Binance</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 600px; margin: 0 auto; }
    .header { background-color: var(--card-bg); padding: 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border: 1px solid #334155; }
    .header h1 { font-size: 1.1rem; color: var(--yellow); }
    .badge { background-color: rgba(34, 197, 94, 0.2); color: var(--green); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; border: 1px solid var(--green); }
    .time-bar { background-color: #1e293b; color: var(--text-muted); font-size: 0.8rem; text-align: center; padding: 6px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #334155; }
    .filter-info { background-color: #0284c7; color: white; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; text-align: center; margin-bottom: 16px; font-weight: bold; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .card { background-color: var(--card-bg); padding: 14px; border-radius: 12px; border: 1px solid #334155; }
    .card-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .card-value { font-size: 1.3rem; font-weight: bold; }
    .value-compra { color: var(--green); }
    .value-venta { color: var(--red); }
    .value-spread { color: var(--yellow); }
    .value-ganancia { color: var(--blue); }
    .chart-card { background-color: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid #334155; }
    .chart-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 6px 0; border-bottom: 1px solid #334155; }
  </style>
</head>
<body>

  <div class="header">
    <h1>⚡ COMERCIANTE P2P PRO</h1>
    <span class="badge" id="estado">EN VIVO</span>
  </div>

  <div class="time-bar">
    🇻🇪 Hora Oficial VE: <strong id="reloj-ve" style="color: var(--text-main);">00:00:00 PM</strong>
  </div>

  <div class="filter-info">
    🎯 Filtro: Comerciante No Verificado (5,000 Bs - 300,000 Bs)
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-label">Compra</div>
      <div class="card-value value-compra" id="precio-compra">0.00 Bs</div>
    </div>
    <div class="card">
      <div class="card-label">Venta / Recompra</div>
      <div class="card-value value-venta" id="precio-venta">0.00 Bs</div>
    </div>
    <div class="card">
      <div class="card-label">Spread Bruto</div>
      <div class="card-value value-spread" id="spread">0.00 Bs</div>
    </div>
    <div class="card">
      <div class="card-label">Ganancia Neta Ciclo</div>
      <div class="card-value value-ganancia" id="ganancia">0.00%</div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-title">📊 Histórico de Lecturas (Hora VE)</div>
    <div class="history-list" id="historial-container">
      <div class="history-item" style="color: var(--text-muted);">Cargando historial...</div>
    </div>
  </div>

  <script>
    function actualizarReloj() {
      const ahora = new Date();
      const opciones = { timeZone: 'America/Caracas', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      document.getElementById('reloj-ve').innerText = ahora.toLocaleTimeString('es-VE', opciones);
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    async function actualizarDashboard() {
      try {
        const respuesta = await fetch("https://p2p-monitor-binance.onrender.com");
        const datos = await respuesta.json();

        if (datos.compra) document.getElementById("precio-compra").innerText = `${datos.compra.toFixed(2)} Bs`;
        if (datos.venta) document.getElementById("precio-venta").innerText = `${datos.venta.toFixed(2)} Bs`;
        if (datos.spread) document.getElementById("spread").innerText = `${datos.spread.toFixed(2)} Bs`;
        if (datos.ganancia_pct) document.getElementById("ganancia").innerText = `${datos.ganancia_pct.toFixed(2)}%`;

        if (datos.historial && datos.historial.length > 0) {
          const container = document.getElementById("historial-container");
          container.innerHTML = "";
          datos.historial.slice().reverse().forEach(item => {
            const div = document.createElement("div");
            div.className = "history-item";
            div.innerHTML = `
              <span>🕒 ${item.hora}</span>
              <span>C: <strong style="color: var(--green);">${item.compra.toFixed(2)}</strong> | V: <strong style="color: var(--red);">${item.venta.toFixed(2)}</strong></span>
            `;
            container.appendChild(div);
          });
        }
        document.getElementById("estado").innerText = "EN VIVO";
      } catch (error) {
        console.error("Error cargando API:", error);
        document.getElementById("estado").innerText = "RECONECTANDO";
      }
    }

    actualizarDashboard();
    setInterval(actualizarDashboard, 30000);
  </script>
</body>
</html>
