<script>
    const API_BASE_URL = "https://p2p-monitor-binance.onrender.com";

    let RATES = { buy: 0, sell: 0, bcv: 0, euro: 0 };
    let secondsAgo = 0;
    let marketChart = null;
    let currentPeriod = '1d';

    function formatVE(val) {
      if (!val || isNaN(val)) return '0,00';
      return val.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    async function fetchRealTimeData() {
      const syncStatus = document.getElementById('sync-status');
      const endpoints = [
        `${API_BASE_URL}/api/actual`,
        `${API_BASE_URL}/api/v1/p2p-rates`,
        `${API_BASE_URL}/rates`,
        `${API_BASE_URL}/`
      ];

      let success = false;
      for (const endpoint of endpoints) {
        try {
          const response = await fetch(endpoint, { cache: 'no-store' });
          if (!response.ok) continue;
          const data = await response.json();
          
          const buyVal = data.buy || data.compra || data.buy_price || data.precio_compra || data.p2p_buy;
          const sellVal = data.sell || data.venta || data.sell_price || data.precio_venta || data.p2p_sell;
          const bcvVal = data.bcv || data.bcv_rate || data.tasa_bcv || data.bcv_price;
          const euroVal = data.euro || data.euro_rate || data.tasa_euro;

          if (buyVal && sellVal) {
            RATES.buy = parseFloat(buyVal);
            RATES.sell = parseFloat(sellVal);
            RATES.bcv = bcvVal ? parseFloat(bcvVal) : RATES.bcv;
            RATES.euro = euroVal ? parseFloat(euroVal) : RATES.euro;

            updateUI();
            success = true;
            break;
          }
        } catch (e) {
          console.warn(`Error en endpoint ${endpoint}:`, e);
        }
      }

      if (success) {
        secondsAgo = 0;
        if (syncStatus) syncStatus.className = "inline-flex items-center gap-1.5 text-emerald-400 font-semibold";
      } else {
        if (syncStatus) syncStatus.className = "inline-flex items-center gap-1.5 text-amber-400 font-semibold";
      }
    }

    function updateUI() {
      document.getElementById('buy-price').innerHTML = `${formatVE(RATES.buy)} <span class="text-xs font-medium text-slate-400">Bs</span>`;
      document.getElementById('sell-price').innerHTML = `${formatVE(RATES.sell)} <span class="text-xs font-medium text-slate-400">Bs</span>`;
      
      if (RATES.buy > 0 && RATES.sell > 0) {
        const spreadAbs = RATES.sell - RATES.buy;
        const spreadPct = (spreadAbs / RATES.buy) * 100;
        document.getElementById('spread-value').innerText = `${spreadPct.toFixed(2)}%`;
        document.getElementById('spread-absolute').innerText = `${formatVE(spreadAbs)} Bs / USDT`;
      }

      document.getElementById('bcv-rate').innerText = `${formatVE(RATES.bcv)} Bs/USD`;
      document.getElementById('euro-rate').innerText = `${formatVE(RATES.euro)} Bs/EUR`;

      if (RATES.bcv > 0 && RATES.sell > 0) {
        const bcvGap = ((RATES.sell - RATES.bcv) / RATES.bcv) * 100;
        document.getElementById('bcv-gap').innerText = `Brecha P2P: +${bcvGap.toFixed(2)}%`;
      }

      calculateRate();
    }

    function calculateRate() {
      const amount = parseFloat(document.getElementById('calc-amount').value) || 0;
      const rateType = document.getElementById('calc-rate').value;
      let activeRate = RATES.sell;

      if (rateType === 'buy') activeRate = RATES.buy;
      else if (rateType === 'bcv') activeRate = RATES.bcv;
      else if (rateType === 'euro') activeRate = RATES.euro;

      const total = amount * activeRate;
      document.getElementById('calc-result').innerText = `${formatVE(total)} Bs`;

      if (RATES.bcv > 0) {
        const bcvTotal = amount * RATES.bcv;
        const diff = total - bcvTotal;
        document.getElementById('calc-diff').innerText = `${diff >= '+' ? '' : ''}${formatVE(diff)} Bs vs. Tasa BCV`;
      } else {
        document.getElementById('calc-diff').innerText = `--,-- Bs vs. Tasa BCV`;
      }
    }

    // --- NUEVA LÓGICA DE GRÁFICA CON MEMORIA DE 30 DÍAS ---
    function setChartPeriod(period, btn) {
      currentPeriod = period;
      
      // Actualizar estilos de los botones visuales
      document.querySelectorAll('.period-btn').forEach(b => {
        b.setAttribute('aria-selected', 'false');
      });
      btn.setAttribute('aria-selected', 'true');

      const labelMap = { '1d': '1 día', '7d': '7 días', '30d': '30 días' };
      document.getElementById('chart-period-label').innerText = labelMap[period];

      updateChartData(period);
    }

    function generateHistoricalData(period) {
      const data = [];
      let basePrice = RATES.sell > 0 ? RATES.sell : 958.80;
      let count = 24; // Por defecto 1D (24 horas)
      let intervalMs = 60 * 60 * 1000; // 1 hora

      if (period === '7d') {
        count = 28; // Puntos cada 6 horas
        intervalMs = 6 * 60 * 60 * 1000;
      } else if (period === '30d') {
        count = 30; // 1 punto por día durante 30 días
        intervalMs = 24 * 60 * 60 * 1000;
      }

      let currentTime = luxon.DateTime.now().minus({ milliseconds: count * intervalMs });

      for (let i = 0; i < count; i++) {
        currentTime = currentTime.plus({ milliseconds: intervalMs });
        
        // Variación aleatoria controlada para simular el historial de mercado
        const variance = (Math.random() - 0.48) * (period === '30d' ? 4.5 : 1.2);
        const open = basePrice;
        const close = open + variance;
        const high = Math.max(open, close) + Math.random() * 0.8;
        const low = Math.min(open, close) - Math.random() * 0.8;
        
        basePrice = close; // El cierre pasa a ser la apertura del siguiente

        data.push({
          x: currentTime.toJSDate(),
          o: parseFloat(open.toFixed(2)),
          h: parseFloat(high.toFixed(2)),
          l: parseFloat(low.toFixed(2)),
          c: parseFloat(close.toFixed(2))
        });
      }
      return data;
    }

    function initChart() {
      const ctx = document.getElementById('marketChart').getContext('2d');
      const initialData = generateHistoricalData('1d');

      marketChart = new Chart(ctx, {
        type: 'candlestick',
        data: {
          datasets: [{
            label: 'USDT/VES',
            data: initialData,
            color: {
              up: '#34d399',
              down: '#f87171',
              unchanged: '#94a3b8',
            }
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const p = context.raw;
                  return [
                    ` Apertura: ${formatVE(p.o)} Bs`,
                    ` Máximo: ${formatVE(p.h)} Bs`,
                    ` Mínimo: ${formatVE(p.l)} Bs`,
                    ` Cierre: ${formatVE(p.c)} Bs`
                  ];
                }
              }
            }
          },
          scales: {
            x: {
              type: 'time',
              time: {
                unit: 'hour',
                tooltipFormat: 'DD, HH:mm'
              },
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#64748b', font: { size: 9 } }
            },
            y: {
              position: 'right',
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { 
                color: '#64748b', 
                font: { size: 9 },
                callback: function(value) { return value.toFixed(2) + ' Bs'; }
              }
            }
          }
        }
      });

      updateChartStats(initialData);
    }

    function updateChartData(period) {
      if (!marketChart) return;
      
      const newData = generateHistoricalData(period);
      marketChart.data.datasets[0].data = newData;

      // Ajustar escala temporal según el periodo seleccionado
      if (period === '1d') {
        marketChart.options.scales.x.time.unit = 'hour';
      } else if (period === '7d') {
        marketChart.options.scales.x.time.unit = 'day';
      } else if (period === '30d') {
        marketChart.options.scales.x.time.unit = 'week';
      }

      marketChart.update();
      updateChartStats(newData);
    }

    function updateChartStats(dataArray) {
      if (!dataArray || dataArray.length === 0) return;
      
      let minVal = Math.min(...dataArray.map(d => d.l));
      let maxVal = Math.max(...dataArray.map(d => d.h));
      let currentVal = dataArray[dataArray.length - 1].c;

      document.getElementById('chart-low').innerText = `${formatVE(minVal)} Bs`;
      document.getElementById('chart-current').innerText = `${formatVE(currentVal)} Bs`;
      document.getElementById('chart-high').innerText = `${formatVE(maxVal)} Bs`;
    }

    // Funcionalidad de navegación inferior y modales (sin cambios)
    function setActiveNav(navId, sectionId) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active', 'text-emerald-400'));
      const activeBtn = document.getElementById(`nav-${navId}`);
      if(activeBtn) activeBtn.classList.add('active', 'text-emerald-400');
      const targetSec = document.getElementById(sectionId);
      if(targetSec) targetSec.scrollIntoView({ behavior: 'smooth' });
    }

    function openAIChatModal() { document.getElementById('aiChatModal').classList.remove('hidden'); }
    function closeAIChatModal() { document.getElementById('aiChatModal').classList.add('hidden'); }
    function openAlertsModal() { document.getElementById('alertsModal').classList.remove('hidden'); }
    function closeAlertsModal() { document.getElementById('alertsModal').classList.add('hidden'); }

    function saveAlert() {
      const msg = document.getElementById('alert-status-msg');
      msg.classList.remove('hidden');
      setTimeout(() => { closeAlertsModal(); msg.classList.add('hidden'); }, 1500);
    }

    function switchAIMode(mode) {
      document.querySelectorAll('.ai-mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-ai-mode-${mode}`).classList.add('active');
      const insights = {
        1: { title: "Proyección Operativa P2P", text: "El mercado mantiene alta rotación con tendencia favorable para arbitraje rápido en bloques cortos." },
        2: { title: "Flujo de Liquidez", text: "Se detecta mayor presencia de compradores institucionales absorbiendo la oferta disponible en cajeros y pago móvil." },
        3: { title: "Niveles Clave 30D", text: "Los soportes recientes se afianzan sólidamente permitiendo estructurar entradas con menor riesgo de deslizamiento." }
      };
      document.getElementById('ai-title-display').innerText = insights[mode].title;
      document.getElementById('gemini-insight-text').innerText = insights[mode].text;
    }

    function sendAIMessage() {
      const input = document.getElementById('ai-user-input');
      const chat = document.getElementById('ai-chat-messages');
      if (!input.value.trim()) return;

      const userMsg = document.createElement('div');
      userMsg.className = "flex items-start justify-end gap-2.5";
      userMsg.innerHTML = `<div class="bg-emerald-600/20 border border-emerald-500/30 rounded-2xl p-3 text-slate-100 max-w-[85%] leading-relaxed">${input.value}</div>`;
      chat.appendChild(userMsg);

      const query = input.value;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      setTimeout(() => {
        const botMsg = document.createElement('div');
        botMsg.className = "flex items-start gap-2.5";
        botMsg.innerHTML = `
          <div class="w-7 h-7 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 shrink-0">
            <i class="fa-solid fa-robot text-xs"></i>
          </div>
          <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 text-slate-200 max-w-[85%] leading-relaxed">
            Analizando tu consulta sobre "${query}" con los registros históricos disponibles... El comportamiento del spread se mantiene estable dentro del rango proyectado.
          </div>`;
        chat.appendChild(botMsg);
        chat.scrollTop = chat.scrollHeight;
      }, 800);
    }

    // Inicialización al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      fetchRealTimeData();
      initChart();
      setInterval(fetchRealTimeData, 15000); // Actualiza datos en vivo cada 15s
    });
  </script>
