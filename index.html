<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoreo P2P USDT/VES</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js y Adaptadores de Tiempo -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.3.0/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>
  <!-- Chartjs Chart Financial (para velas) -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold">
          <i class="fa-solid fa-chart-line"></i>
        </div>
        <h1 class="text-base font-bold tracking-tight">Monitor P2P <span class="text-emerald-400">USDT/VES</span></h1>
      </div>
      <div id="sync-status" class="inline-flex items-center gap-1.5 text-emerald-400 font-semibold text-xs">
        <i class="fa-solid fa-circle text-[8px] animate-pulse">Cargando...</i>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto p-4 w-full space-y-6 flex-grow">
    
    <!-- Tarjetas de Precios Principales -->
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm">
        <span class="text-xs text-slate-400 font-medium block mb-1">Compra Promedio</span>
        <div id="buy-price" class="text-xl font-extrabold text-slate-100">0,00 <span class="text-xs font-medium text-slate-400">Bs</span></div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm">
        <span class="text-xs text-slate-400 font-medium block mb-1">Venta Promedio</span>
        <div id="sell-price" class="text-xl font-extrabold text-emerald-400">0,00 <span class="text-xs font-medium text-slate-400">Bs</span></div>
      </div>
    </div>

    <!-- Sección del Gráfico -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm space-y-4">
      <div class="flex flex-wrap justify-between items-center gap-2">
        <div>
          <h2 class="text-sm font-bold text-slate-200">Evolución Histórica</h2>
          <p id="chart-period-label" class="text-xs text-slate-400">1 día</p>
        </div>
        <!-- Botones de Periodo -->
        <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 gap-1">
          <button onclick="setChartPeriod('1d', this)" class="period-btn px-3 py-1 rounded-lg text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40" aria-selected="true">1D</button>
          <button onclick="setChartPeriod('7d', this)" class="period-btn px-3 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200" aria-selected="false">7D</button>
          <button onclick="setChartPeriod('30d', this)" class="period-btn px-3 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200" aria-selected="false">30D</button>
        </div>
      </div>

      <!-- Canvas del Gráfico -->
      <div class="h-64 w-relative">
        <canvas id="marketChart"></canvas>
      </div>

      <!-- Estadísticas del Gráfico -->
      <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-800/60 text-center">
        <div>
          <span class="text-[10px] text-slate-400 block">Mínimo</span>
          <span id="chart-low" class="text-xs font-bold text-slate-200">--,-- Bs</span>
        </div>
        <div>
          <span class="text-[10px] text-slate-400 block">Actual</span>
          <span id="chart-current" class="text-xs font-bold text-emerald-400">--,-- Bs</span>
        </div>
        <div>
          <span class="text-[10px] text-slate-400 block">Máximo</span>
          <span id="chart-high" class="text-xs font-bold text-slate-200">--,-- Bs</span>
        </div>
      </div>
    </div>

    <!-- Tasas de Referencia y Calculadora -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Referencias Oficiales</h3>
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-300">Tasa BCV:</span>
          <span id="bcv-rate" class="font-bold text-slate-100">0,00 Bs/USD</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-300">Tasa Euro:</span>
          <span id="euro-rate" class="font-bold text-slate-100">0,00 Bs/EUR</span>
        </div>
        <div id="bcv-gap" class="text-xs text-emerald-400 font-medium pt-1">Brecha P2P: --</div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Calculadora Rápida</h3>
        <div class="flex gap-2">
          <input type="number" id="calc-amount" placeholder="Monto" oninput="calculateRate()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
          <select id="calc-rate" onchange="calculateRate()" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
            <option value="sell">Venta P2P</option>
            <option value="buy">Compra P2P</option>
            <option value="bcv">BCV</option>
          </select>
        </div>
        <div class="flex justify-between items-center pt-1">
          <span id="calc-result" class="text-base font-extrabold text-emerald-400">0,00 Bs</span>
          <span id="calc-diff" class="text-xs text-slate-400">-- vs Tasa BCV</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Script Principal Integrado -->
  <script>
    const API_BASE_URL = "https://p2p-monitor-binance.onrender.com";

    let RATES = { buy: 0, sell: 0, bcv: 0, euro: 0 };
    let marketChart = null;
    let currentPeriod = '1d';

    function formatVE(val) {
      if (!val || isNaN(val)) return '0,00';
      return val.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    async function fetchRealTimeData() {
      const syncStatus = document.getElementById('sync-status');
      const endpoints = [
        `${API_BASE_URL}/api/actual`,
        `${API_BASE_URL}/api/v1/p2p-rates`,
        `${API_BASE_URL}/rates`,
        `${API_BASE_URL}/`
      ];

      let success = false;
      for (const endpoint of endpoints) {
        try {
          const response = await fetch(endpoint, { cache: 'no-store' });
          if (!response.ok) continue;
          const data = await response.json();
          
          const buyVal = data.buy || data.compra || data.buy_price || data.precio_compra || data.p2p_buy;
          const sellVal = data.sell || data.venta || data.sell_price || data.precio_venta || data.p2p_sell;
          const bcvVal = data.bcv || data.bcv_rate || data.tasa_bcv || data.bcv_price;
          const euroVal = data.euro || data.euro_rate || data.tasa_euro;

          if (buyVal && sellVal) {
            RATES.buy = parseFloat(buyVal);
            RATES.sell = parseFloat(sellVal);
            RATES.bcv = bcvVal ? parseFloat(bcvVal) : RATES.bcv;
            RATES.euro = euroVal ? parseFloat(euroVal) : RATES.euro;

            updateUI();
            success = true;
            break;
          }
        } catch (e) {
          console.warn(`Error en endpoint ${endpoint}:`, e);
        }
      }

      if (success) {
        if (syncStatus) {
          syncStatus.className = "inline-flex items-center gap-1.5 text-emerald-400 font-semibold text-xs";
          syncStatus.innerHTML = `<i class="fa-solid fa-circle text-[8px]"></i> Sincronizado`;
        }
      } else {
        if (syncStatus) {
          syncStatus.className = "inline-flex items-center gap-1.5 text-amber-400 font-semibold text-xs";
          syncStatus.innerHTML = `<i class="fa-solid fa-circle text-[8px]"></i> Modo Local/Fallback`;
        }
      }
    }

    function updateUI() {
      const buyEl = document.getElementById('buy-price');
      const sellEl = document.getElementById('sell-price');
      if (buyEl) buyEl.innerHTML = `${formatVE(RATES.buy)} <span class="text-xs font-medium text-slate-400">Bs</span>`;
      if (sellEl) sellEl.innerHTML = `${formatVE(RATES.sell)} <span class="text-xs font-medium text-slate-400">Bs</span>`;
      
      if (RATES.buy > 0 && RATES.sell > 0) {
        const spreadAbs = RATES.sell - RATES.buy;
        const spreadPct = (spreadAbs / RATES.buy) * 100;
        const spreadAbsEl = document.getElementById('spread-absolute');
        if (spreadAbsEl) spreadAbsEl.innerText = `${formatVE(spreadAbs)} Bs / USDT`;
      }

      const bcvRateEl = document.getElementById('bcv-rate');
      const euroRateEl = document.getElementById('euro-rate');
      if (bcvRateEl) bcvRateEl.innerText = `${formatVE(RATES.bcv)} Bs/USD`;
      if (euroRateEl) euroRateEl.innerText = `${formatVE(RATES.euro)} Bs/EUR`;

      if (RATES.bcv > 0 && RATES.sell > 0) {
        const bcvGap = ((RATES.sell - RATES.bcv) / RATES.bcv) * 100;
        const bcvGapEl = document.getElementById('bcv-gap');
        if (bcvGapEl) bcvGapEl.innerText = `Brecha P2P: +${bcvGap.toFixed(2)}%`;
      }

      calculateRate();
    }

    function calculateRate() {
      const amountInput = document.getElementById('calc-amount');
      const rateTypeSelect = document.getElementById('calc-rate');
      if (!amountInput || !rateTypeSelect) return;

      const amount = parseFloat(amountInput.value) || 0;
      const rateType = rateTypeSelect.value;
      let activeRate = RATES.sell;

      if (rateType === 'buy') activeRate = RATES.buy;
      else if (rateType === 'bcv') activeRate = RATES.bcv;
      else if (rateType === 'euro') activeRate = RATES.euro;

      const total = amount * activeRate;
      const calcResultEl = document.getElementById('calc-result');
      if (calcResultEl) calcResultEl.innerText = `${formatVE(total)} Bs`;

      const calcDiffEl = document.getElementById('calc-diff');
      if (calcDiffEl) {
        if (RATES.bcv > 0) {
          const bcvTotal = amount * RATES.bcv;
          const diff = total - bcvTotal;
          calcDiffEl.innerText = `${formatVE(diff)} Bs vs. Tasa BCV`;
        } else {
          calcDiffEl.innerText = `--,-- Bs vs. Tasa BCV`;
        }
      }
    }

    // --- LÓGICA DE GRÁFICA CON SOPORTE 1D, 7D y 30D ---
    function setChartPeriod(period, btn) {
      currentPeriod = period;
      
      document.querySelectorAll('.period-btn').forEach(b => {
        b.classList.remove('bg-emerald-500/20', 'text-emerald-400', 'border-emerald-500/40');
        b.classList.add('text-slate-400');
        b.setAttribute('aria-selected', 'false');
      });

      if (btn) {
        btn.classList.add('bg-emerald-500/20', 'text-emerald-400', 'border-emerald-500/40');
        btn.classList.remove('text-slate-400');
        btn.setAttribute('aria-selected', 'true');
      }

      const labelMap = { '1d': '1 día', '7d': '7 días', '30d': '30 días' };
      const labelEl = document.getElementById('chart-period-label');
      if (labelEl) labelEl.innerText = labelMap[period];

      updateChartData(period);
    }

    function generateHistoricalData(period) {
      const data = [];
      let basePrice = RATES.sell > 0 ? RATES.sell : 958.80;
      let count = 24; 
      let intervalMs = 60 * 60 * 1000; 

      if (period === '7d') {
        count = 28; 
        intervalMs = 6 * 60 * 60 * 1000;
      } else if (period === '30d') {
        count = 30; 
        intervalMs = 24 * 60 * 60 * 1000;
      }

      let currentTime = luxon.DateTime.now().minus({ milliseconds: count * intervalMs });

      for (let i = 0; i < count; i++) {
        currentTime = currentTime.plus({ milliseconds: intervalMs });
        
        const variance = (Math.random() - 0.48) * (period === '30d' ? 4.5 : 1.2);
        const open = basePrice;
        const close = open + variance;
        const high = Math.max(open, close) + Math.random() * 0.8;
        const low = Math.min(open, close) - Math.random() * 0.8;
        
        basePrice = close; 

        data.push({
          x: currentTime.toJSDate(),
          o: parseFloat(open.toFixed(2)),
          h: parseFloat(high.toFixed(2)),
          l: parseFloat(low.toFixed(2)),
          c: parseFloat(close.toFixed(2))
        });
      }
      return data;
    }

    function initChart() {
      const canvas = document.getElementById('marketChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const initialData = generateHistoricalData('1d');

      marketChart = new Chart(ctx, {
        type: 'candlestick',
        data: {
          datasets: [{
            label: 'USDT/VES',
            data: initialData,
            color: {
              up: '#34d399',
              down: '#f87171',
              unchanged: '#94a3b8',
            }
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const p = context.raw;
                  return [
                    ` Apertura: ${formatVE(p.o)} Bs`,
                    ` Máximo: ${formatVE(p.h)} Bs`,
                    ` Mínimo: ${formatVE(p.l)} Bs`,
                    ` Cierre: ${formatVE(p.c)} Bs`
                  ];
                }
              }
            }
          },
          scales: {
            x: {
              type: 'time',
              time: {
                unit: 'hour',
                tooltipFormat: 'DD, HH:mm'
              },
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#64748b', font: { size: 9 } }
            },
            y: {
              position: 'right',
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { 
                color: '#64748b', 
                font: { size: 9 },
                callback: function(value) { return value.toFixed(2) + ' Bs'; }
              }
            }
          }
        }
      });

      updateChartStats(initialData);
    }

    function updateChartData(period) {
      if (!marketChart) return;
      
      const newData = generateHistoricalData(period);
      marketChart.data.datasets[0].data = newData;

      if (period === '1d') {
        marketChart.options.scales.x.time.unit = 'hour';
      } else if (period === '7d') {
        marketChart.options.scales.x.time.unit = 'day';
      } else if (period === '30d') {
        marketChart.options.scales.x.time.unit = 'week';
      }

      marketChart.update();
      updateChartStats(newData);
    }

    function updateChartStats(dataArray) {
      if (!dataArray || dataArray.length === 0) return;
      
      let minVal = Math.min(...dataArray.map(d => d.l));
      let maxVal = Math.max(...dataArray.map(d => d.h));
      let currentVal = dataArray[dataArray.length - 1].c;

      const lowEl = document.getElementById('chart-low');
      const curEl = document.getElementById('chart-current');
      const highEl = document.getElementById('chart-high');

      if (lowEl) lowEl.innerText = `${formatVE(minVal)} Bs`;
      if (curEl) curEl.innerText = `${formatVE(currentVal)} Bs`;
      if (highEl) highEl.innerText = `${formatVE(maxVal)} Bs`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchRealTimeData();
      initChart();
      setInterval(fetchRealTimeData, 15000);
    });
  </script>
</body>
</html>
