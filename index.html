<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comerciante P2P Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 0.85rem; }
    </style>
</head>
<body class="p-3 max-w-md mx-auto space-y-3">

    <!-- Header Status -->
    <div class="card flex justify-between items-center py-2.5">
        <span class="text-yellow-400 font-bold text-base flex items-center gap-1">⚡ COMERCIANTE P2P PRO</span>
        <span id="status-tag" class="px-2 py-0.5 text-[10px] rounded-full bg-emerald-900 text-emerald-300 font-bold tracking-wide">EN VIVO</span>
    </div>

    <!-- Banner Hora Oficial y Filtro en Grid Compacto -->
    <div class="grid grid-cols-1 gap-1.5">
        <div class="bg-slate-800 text-center py-1.5 rounded-lg text-xs text-slate-300 border border-slate-700">
            🇻🇪 Hora Oficial VE: <span id="hora-ve" class="font-bold text-white">--:--:--</span>
        </div>
        <div class="bg-sky-600/90 text-white text-center py-1.5 px-2 rounded-lg text-[11px] font-medium border border-sky-500">
            🎯 Filtro: No Verificado (10,000 Bs - 300,000 Bs)
        </div>
    </div>

    <!-- Métricas Principales (Grid Ajustado) -->
    <div class="grid grid-cols-3 gap-2">
        <div class="card text-center py-2 px-1">
            <p class="text-[9px] text-slate-400 font-bold tracking-wider uppercase mb-1">COMPRA</p>
            <p id="precio-compra" class="text-sm font-extrabold text-emerald-400 truncate">0.00 Bs</p>
        </div>
        <div class="card text-center py-2 px-1">
            <p class="text-[9px] text-slate-400 font-bold tracking-wider uppercase mb-1">VENTA</p>
            <p id="precio-venta" class="text-sm font-extrabold text-rose-400 truncate">0.00 Bs</p>
        </div>
        <div class="card text-center py-2 px-1">
            <p class="text-[9px] text-slate-400 font-bold tracking-wider uppercase mb-1">SPREAD BRUTO</p>
            <p id="spread-bruto" class="text-sm font-extrabold text-amber-400 truncate">0.00 Bs</p>
        </div>
    </div>

    <!-- Tarjeta Predicción ML + Tendencia Integrada -->
    <div class="card border-purple-500/40 bg-slate-900/90 space-y-3">
        <!-- Encabezado de la Tarjeta -->
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
            <div>
                <span class="text-[10px] font-bold text-purple-400 block uppercase tracking-wider">PREDICCIÓN ML</span>
                <span id="ml-hora" class="text-[11px] font-semibold text-slate-300">--:--</span>
            </div>
            <div class="text-right">
                <span class="text-[9px] font-bold text-slate-400 block uppercase tracking-wider">TENDENCIA</span>
                <span id="ml-tendencia" class="text-xs font-bold text-purple-300">--</span>
            </div>
        </div>

        <!-- Precio Central -->
        <div class="text-center py-1">
            <div class="text-3xl font-black text-white tracking-tight" id="ml-precio">0.00 Bs</div>
        </div>

        <!-- Piso y Techo -->
        <div class="flex justify-between text-xs pt-2 border-t border-slate-800/80">
            <span class="text-emerald-400 font-semibold text-[11px]">🟢 Piso: <span id="ml-piso">0.00 Bs</span></span>
            <span class="text-rose-400 font-semibold text-[11px]">🔴 Techo: <span id="ml-techo">0.00 Bs</span></span>
        </div>
    </div>

    <!-- Espacio Reservado para la Gráfica -->
    <div class="card flex flex-col items-center justify-center py-6 text-slate-500 border-dashed border-slate-700">
        <span class="text-xl mb-1">📊</span>
        <span class="text-xs font-medium text-slate-400">Área Reservada para Gráfica Interactiva</span>
    </div>

    <script>
        const API_URL = "https://p2p-monitor-binance.onrender.com";

        function actualizarHora() {
            const ahora = new Date();
            const opciones = { timeZone: "America/Caracas", hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById("hora-ve").innerText = ahora.toLocaleTimeString('es-VE', opciones);
        }
        setInterval(actualizarHora, 1000);

        async function cargarDatos() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();

                // Precios
                document.getElementById("precio-compra").innerText = (data.compra || 0).toFixed(2) + " Bs";
                document.getElementById("precio-venta").innerText = (data.venta || 0).toFixed(2) + " Bs";
                document.getElementById("spread-bruto").innerText = (data.spread || 0).toFixed(2) + " Bs";

                // ML y Tendencia
                const ml = data.ml_prediccion || {};
                document.getElementById("ml-precio").innerText = (data.prediccion || ml.precio || 0).toFixed(2) + " Bs";
                document.getElementById("ml-piso").innerText = (data.piso || ml.piso || 0).toFixed(2) + " Bs";
                document.getElementById("ml-techo").innerText = (data.techo || ml.techo || 0).toFixed(2) + " Bs";
                document.getElementById("ml-tendencia").innerText = data.tendencia || ml.tendencia || "ESTABLE";
                document.getElementById("ml-hora").innerText = ml.hora || "+7h";

                // Status
                document.getElementById("status-tag").innerText = "EN VIVO";
                document.getElementById("status-tag").className = "px-2 py-0.5 text-[10px] rounded-full bg-emerald-900 text-emerald-300 font-bold tracking-wide";

            } catch (err) {
                document.getElementById("status-tag").innerText = "RECONECTANDO";
                document.getElementById("status-tag").className = "px-2 py-0.5 text-[10px] rounded-full bg-amber-900 text-amber-300 font-bold tracking-wide";
            }
        }

        cargarDatos();
        setInterval(cargarDatos, 5000);
    </script>
</body>
</html>
